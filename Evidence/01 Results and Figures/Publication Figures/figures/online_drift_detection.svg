<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>
text { font-family: Arial, Helvetica, sans-serif; fill: #1f2933; }
.title { font-size: 21px; font-weight: 700; }
.subtitle { font-size: 12px; fill: #52616b; }
.label { font-size: 12px; }
.small { font-size: 10px; fill: #52616b; }
.axis { stroke: #9aa5b1; stroke-width: 1; }
.grid { stroke: #e4e7eb; stroke-width: 1; }
</style>
<text class="title" x="32" y="38">Online Drift Detection After Sinkhole Activation</text>
<text class="subtitle" x="32" y="60">Five held-out attack and five matched control runs. Attack activates at 240 seconds.</text>
<line class="axis" x1="110" y1="300" x2="710" y2="300"/>
<line class="axis" x1="110" y1="100" x2="110" y2="300"/>
<text class="small" x="47" y="105">delay (s)</text>
<rect x="220" y="300.0" width="100" height="0.0" fill="#2f80ed"/>
<text class="label" text-anchor="middle" x="270" y="290.0">0s</text>
<text class="label" text-anchor="middle" x="270" y="330">rank_state_cusum</text>
<text class="small" text-anchor="middle" x="270" y="350">5/5 attacks</text>
<text class="small" text-anchor="middle" x="270" y="366">0/5 controls false-alerted</text>
<rect x="450" y="130.0" width="100" height="170.0" fill="#2f80ed"/>
<text class="label" text-anchor="middle" x="500" y="120.0">60s</text>
<text class="label" text-anchor="middle" x="500" y="330">ddm_on_delayed_cart_errors</text>
<text class="small" text-anchor="middle" x="500" y="350">5/5 attacks</text>
<text class="small" text-anchor="middle" x="500" y="366">0/5 controls false-alerted</text>
<text class="small" x="110" y="405">The zero-delay CUSUM signal occurred in the first 60-second post-activation window.</text>
</svg>
